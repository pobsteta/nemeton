url: https://pobsteta.github.io/nemeton/
template:
  bootstrap: 5
  bootswatch: flatly
  theme: arrow-light
  bslib:
    primary: "#2E7D32"
    success: "#4CAF50"

home:
  title: "nemeton - Analyse Systémique Forestière"
  description: >
    Évaluation multi-famille des services écosystémiques pour la gestion
    forestière avec la méthode Nemeton. Calculez, normalisez, agrégez et
    visualisez des indicateurs biophysiques à travers 12 familles de
    services écosystémiques.
  links:
  - text: Voir sur GitHub
    href: https://github.com/pobsteta/nemeton

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: Démarrage rapide
        href: articles/getting-started_fr.html
      - text: Familles d'indicateurs (12 familles)
        href: articles/indicator-families_fr.html
      - text: "---"
      - text: Référentiel complet 12 familles
        href: articles/complete-referential_fr.html
      - text: Optimisation multi-critères
        href: articles/multi-criteria-optimization_fr.html
      - text: Biodiversité et résilience
        href: articles/biodiversity-resilience-v030_fr.html
      - text: Analyse temporelle
        href: articles/temporal-analysis_fr.html
      - text: "---"
      - text: Internationalisation (i18n)
        href: articles/internationalization.html

reference:
  - title: "Gestion des données"
    desc: "Créer et gérer les unités spatiales et les couches"
    contents:
    - nemeton_units
    - nemeton_layers
    - massif_demo_units
    - massif_demo_layers

  - title: "Workflow principal"
    desc: "Fonctions principales pour le calcul d'indicateurs"
    contents:
    - nemeton_compute
    - list_indicators

  - title: "Famille C : Carbone & Vitalité"
    desc: "Stockage de carbone et vitalité de la végétation"
    contents:
    - indicator_carbon_biomass
    - indicator_carbon_ndvi

  - title: "Famille B : Biodiversité"
    desc: "Protection, diversité structurelle et connectivité écologique"
    contents:
    - indicator_biodiversity_protection
    - indicator_biodiversity_structure
    - indicator_biodiversity_connectivity

  - title: "Famille W : Régulation de l'eau"
    desc: "Régulation hydrologique et zones humides"
    contents:
    - indicator_water_network
    - indicator_water_wetlands
    - indicator_water_twi

  - title: "Famille A : Air & Microclimat"
    desc: "Couverture arborée et qualité de l'air"
    contents:
    - indicator_air_coverage
    - indicator_air_quality

  - title: "Famille F : Fertilité des sols"
    desc: "Qualité du sol et risque d'érosion"
    contents:
    - indicator_soil_fertility
    - indicator_soil_erosion

  - title: "Famille L : Paysage"
    desc: "Structure du paysage et connectivité"
    contents:
    - indicator_landscape_fragmentation
    - indicator_landscape_edge

  - title: "Famille T : Dynamique temporelle"
    desc: "Ancienneté des peuplements et changements d'occupation"
    contents:
    - indicator_temporal_age
    - indicator_temporal_change

  - title: "Famille R : Risques & Résilience"
    desc: "Vulnérabilité aux incendies, tempêtes et sécheresse"
    contents:
    - indicator_risk_fire
    - indicator_risk_storm
    - indicator_risk_drought
    - indicator_risk_browsing
    - compute_game_pressure_index
    - download_hunting_data
    - get_game_pressure_raster

  - title: "Famille S : Social & Usages"
    desc: "Densité de sentiers, accessibilité et proximité population"
    contents:
    - indicator_social_trails
    - indicator_social_accessibility
    - indicator_social_proximity

  - title: "Famille P : Production & Économie"
    desc: "Volume bois, productivité station et qualité bois d'œuvre"
    contents:
    - indicator_productive_volume
    - indicator_productive_station
    - indicator_productive_quality

  - title: "Famille E : Énergie & Climat"
    desc: "Potentiel bois-énergie et évitement carbone"
    contents:
    - indicator_energy_fuelwood
    - indicator_energy_avoidance

  - title: "Famille N : Naturalité"
    desc: "Distance infrastructures, continuité forestière et indice wilderness"
    contents:
    - indicator_naturalness_distance
    - indicator_naturalness_continuity
    - indicator_naturalness_composite

  - title: "Analyse temporelle"
    desc: "Analyse multi-périodes et détection de changements"
    contents:
    - nemeton_temporal
    - calculate_change_rate

  - title: "Analyse inter-familles"
    desc: "Corrélations et hotspots multi-critères"
    contents:
    - compute_family_correlations
    - identify_hotspots
    - plot_correlation_matrix

  - title: "Analyse multi-critères avancée"
    desc: "Optimisation Pareto, clustering et trade-offs"
    contents:
    - identify_pareto_optimal
    - cluster_parcels
    - plot_tradeoff

  - title: "Normalisation & Agrégation"
    desc: "Transformer et combiner les indicateurs"
    contents:
    - normalize_indicators
    - create_composite_index
    - create_family_index
    - invert_indicator

  - title: "Visualisation"
    desc: "Cartes et graphiques"
    contents:
    - plot_indicators_map
    - plot_comparison_map
    - plot_difference_map
    - nemeton_radar
    - plot_temporal_trend
    - plot_temporal_heatmap

  - title: "Internationalisation"
    desc: "Support multi-langues"
    contents:
    - nemeton_set_language

  - title: "Méthodes S3"
    desc: "Méthodes print et summary pour les objets nemeton"
    contents:
    - print.nemeton_units
    - print.nemeton_layers
    - print.nemeton_temporal
    - summary.nemeton_units
    - summary.nemeton_layers
    - summary.nemeton_temporal

  - title: "Documentation du package"
    contents:
    - nemeton-package

  - title: "Utilitaires"
    desc: "Fonctions de traitement parallèle"
    contents:
    - smart_map
    - smart_map_sf

  - title: "Fonctions internes"
    desc: "Fonctions d'aide internes (pour développeurs)"
    contents:
    - detect_indicator_family
    - get_family_name
    - family-system
    - indicators-families
    - indicators-energy
    - indicators-naturalness
    - indicators-productive
    - indicators-social
    - temporal

authors:
  Pascal Obstétar:
    href: https://github.com/pobsteta

footer:
  structure:
    left: developed_by
    right: built_with
