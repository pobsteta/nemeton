url: https://pobsteta.github.io/nemeton/
template:
  bootstrap: 5
  bootswatch: flatly
  theme: arrow-light
  bslib:
    primary: "#2E7D32"
    success: "#4CAF50"

home:
  title: "nemeton - Analyse Systemique Forestiere"
  description: >
    Package R coeur pour l'analyse multi-famille des services ecosystemiques
    forestiers. 31 indicateurs, 12 familles, systeme NDP (Fibonacci),
    11 essences par region. Methode Nemeton.
  links:
  - text: Voir sur GitHub
    href: https://github.com/pobsteta/nemeton
  - text: Application Shiny (nemetonshiny)
    href: https://github.com/pobsteta/nemetonshiny

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: Demarrage rapide
        href: articles/getting-started_fr.html
      - text: Familles d'indicateurs (12 familles)
        href: articles/indicator-families_fr.html
      - text: "---"
      - text: Referentiel complet 12 familles
        href: articles/complete-referential_fr.html
      - text: Optimisation multi-criteres
        href: articles/multi-criteria-optimization_fr.html
      - text: Biodiversite et resilience
        href: articles/biodiversity-resilience-v030_fr.html
      - text: Indicateurs P1/P2/C1/B2/R2 via CHM Open-Canopy
        href: articles/site-index-open-canopy_fr.html
      - text: Analyse temporelle
        href: articles/temporal-analysis_fr.html

reference:
  - title: "Gestion des donnees"
    desc: "Creer et gerer les unites spatiales et les couches"
    contents:
    - nemeton_units
    - nemeton_layers
    - massif_demo_units
    - massif_demo_layers

  - title: "Workflow principal"
    desc: "Fonctions principales pour le calcul d'indicateurs"
    contents:
    - nemeton_compute
    - list_indicators

  - title: "Famille C : Carbone & Vitalite"
    desc: "Stockage de carbone et vitalite de la vegetation"
    contents:
    - indicateur_c1_biomasse
    - indicateur_c2_ndvi

  - title: "Famille B : Biodiversite"
    desc: "Protection, diversite structurelle et connectivite ecologique"
    contents:
    - indicateur_b1_protection
    - indicateur_b2_structure
    - indicateur_b3_connectivite

  - title: "Famille W : Regulation de l'eau"
    desc: "Regulation hydrologique et zones humides"
    contents:
    - indicateur_w1_reseau
    - indicateur_w2_zones_humides
    - indicateur_w3_humidite

  - title: "Famille A : Air & Microclimat"
    desc: "Couverture arboree et qualite de l'air"
    contents:
    - indicateur_a1_couverture
    - indicateur_a2_qualite_air

  - title: "Famille F : Fertilite des sols"
    desc: "Qualite du sol et risque d'erosion"
    contents:
    - indicateur_f1_fertilite
    - indicateur_f2_erosion

  - title: "Famille L : Paysage"
    desc: "Structure du paysage et connectivite"
    contents:
    - indicateur_l2_fragmentation
    - indicateur_l1_sylvosphere

  - title: "Famille T : Dynamique temporelle"
    desc: "Anciennete des peuplements et changements d'occupation"
    contents:
    - indicateur_t1_anciennete
    - indicateur_t2_changement

  - title: "Famille R : Risques & Resilience"
    desc: "Vulnerabilite aux incendies, tempetes et secheresse"
    contents:
    - indicateur_r1_feu
    - indicateur_r2_tempete
    - indicateur_r3_secheresse
    - indicateur_r4_abroutissement
    - compute_game_pressure_index
    - download_hunting_data
    - get_game_pressure_raster

  - title: "Famille S : Social & Usages"
    desc: "Distance routes, distance bati et proximite population"
    contents:
    - indicateur_s1_routes
    - indicateur_s2_bati
    - indicateur_s3_population

  - title: "Famille P : Production & Economie"
    desc: "Volume bois, productivite station et qualite bois d'oeuvre"
    contents:
    - indicateur_p1_volume
    - indicateur_p2_station
    - indicateur_p3_qualite_bois

  - title: "Famille E : Energie & Climat"
    desc: "Potentiel bois-energie et evitement carbone"
    contents:
    - indicateur_e1_bois_energie
    - indicateur_e2_evitement

  - title: "Famille N : Naturalite"
    desc: "Distance infrastructures, continuite forestiere et indice wilderness"
    contents:
    - indicateur_n1_distance
    - indicateur_n2_continuite
    - indicateur_n3_naturalite

  - title: "CHM et indice de station (spec 005)"
    desc: "Nettoyage d'un Canopy Height Model et estimation de l'indice de station H0"
    contents:
    - sanitize_chm
    - extract_h_dom
    - compute_site_index
    - list_site_index_species
    - read_site_index_curves

  - title: "Systeme NDP (Niveau De Precision)"
    desc: "Ponderation Fibonacci et confiance phi"
    contents:
    - ndp_table
    - get_ndp_level
    - get_ndp_name
    - get_ndp_weight
    - get_ndp_confidence
    - compute_general_index
    - compute_general_index_mixed
    - detect_ndp

  - title: "Configuration essences (ADR-007)"
    desc: "Classification d'essences par region biogeographique"
    contents:
    - get_species_config
    - list_species_classes
    - list_species_regions
    - map_bdforet_essence
    - map_oso_class
    - get_allometric_key

  - title: "Sources de donnees (ADR-002)"
    desc: "Abstraction des sources par pays"
    contents:
    - get_country_config
    - get_data_source
    - get_layer_service
    - get_national_crs
    - get_metric_crs
    - get_storage_crs
    - list_countries

  - title: "Analyse temporelle"
    desc: "Analyse multi-periodes et detection de changements"
    contents:
    - nemeton_temporal
    - calculate_change_rate

  - title: "Analyse inter-familles"
    desc: "Correlations et hotspots multi-criteres"
    contents:
    - compute_family_correlations
    - identify_hotspots
    - plot_correlation_matrix

  - title: "Analyse multi-criteres avancee"
    desc: "Optimisation Pareto, clustering et trade-offs"
    contents:
    - identify_pareto_optimal
    - cluster_parcels
    - plot_tradeoff

  - title: "Normalisation & Agregation"
    desc: "Transformer et combiner les indicateurs"
    contents:
    - normalize_indicators
    - normalize_indicator
    - create_composite_index
    - create_family_index
    - invert_indicator

  - title: "Visualisation"
    desc: "Cartes et graphiques"
    contents:
    - plot_indicators_map
    - plot_comparison_map
    - plot_difference_map
    - nemeton_radar
    - plot_temporal_trend
    - plot_temporal_heatmap

  - title: "Internationalisation"
    desc: "Support multi-langues"
    contents:
    - nemeton_set_language

  - title: "Application Shiny"
    desc: >
      L'application interactive est dans le package separe nemetonshiny.
      Installez-le avec remotes::install_github("pobsteta/nemetonshiny")
      puis lancez nemetonshiny::run_app(language = "fr").

  - title: "Methodes S3"
    desc: "Methodes print et summary pour les objets nemeton"
    contents:
    - print.nemeton_units
    - print.nemeton_layers
    - print.nemeton_temporal
    - summary.nemeton_units
    - summary.nemeton_layers
    - summary.nemeton_temporal

  - title: "Documentation du package"
    contents:
    - nemeton-package

  - title: "Utilitaires"
    desc: "Fonctions de traitement parallele"
    contents:
    - smart_map
    - smart_map_sf
    - get_global_cache_dir
    - detect_indicator_family
    - get_family_name

  - title: "Internal documentation"
    desc: "Package-level and internal documentation pages"
    contents:
    - NDP_LEVELS
    - ndp
    - datasources
    - family-system
    - species-config
    - temporal
    - indicators-families
    - indicators-energy
    - indicators-naturalness
    - indicators-productive
    - indicators-social

authors:
  Pascal Obstetar:
    href: https://github.com/pobsteta

footer:
  structure:
    left: developed_by
    right: built_with
