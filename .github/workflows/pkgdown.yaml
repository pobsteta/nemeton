# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Ce job n'avait aucun plafond : un runner bloqué y tournait
    # sans fin. 90 min, comme les autres jobs lourds.
    timeout-minutes: 90
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # lasR / lidR are not on CRAN; resolve them from r-lidar's
          # r-universe. lidaRtRee comes from forge.inrae.fr (Remotes).
          extra-repositories: 'https://r-lidar.r-universe.dev'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libtbb-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # rsconnect : requis par pkgdown::package_tutorials() pour découvrir
          # les tutoriels learnr de inst/tutorials/ (sinon « The package
          # rsconnect is required to find published tutorials »).
          # dissUtils/spinR : Imports de biodivMapR absents de ses Remotes
          # (cf. r.yml), déclarés ici au root scope pour pak.
          extra-packages: |
            any::pkgdown
            any::rsconnect
            local::.
            github::cran/dissUtils
            jbferet/spinR
          needs: website

      - name: Rebuild Rfast from source (oneTBB ABI mismatch)
        # Le binaire RSPM de Rfast est compilé contre une oneTBB ancienne
        # (symbole `tbb::task`, retiré des versions récentes) : son chargement
        # échoue sur `undefined symbol: _ZTIN3tbb4taskE` quand pkgdown charge le
        # namespace (via biodivMapR (Suggests) -> fundiversity -> Rfast).
        # R-CMD-check ne charge pas ce namespace, d'où l'échec pkgdown seul.
        # Recompiler depuis les sources contre le libtbb-dev du runner résout.
        run: install.packages("Rfast", type = "source")
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        # Deploy only on push to main / published release — never on a
        # pull_request or a manual workflow_dispatch (which build-only, so the
        # site can be validated from a branch without publishing it).
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
