# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Ce job n'avait aucun plafond : un runner bloqué y tournait
    # sans fin. 90 min, comme les autres jobs lourds.
    timeout-minutes: 90
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Les « recommandés » d'apt sont des données et de la doc dont aucune
      # compilation n'a besoin : pari-elldata (57 Mo), pari-doc, lmodern,
      # mupdf-tools (49 Mo)… pak installe les dépendances système des paquets
      # R sans pouvoir passer d'option, on la pose donc globalement, avant
      # tout appel à apt (y compris ceux de setup-r).
      - name: Ne pas installer les paquets apt recommandes
        run: echo 'APT::Install-Recommends "false";' | sudo tee /etc/apt/apt.conf.d/99-no-recommends

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # lasR / lidR are not on CRAN; resolve them from r-lidar's
          # r-universe. lidaRtRee comes from forge.inrae.fr (Remotes).
          extra-repositories: 'https://r-lidar.r-universe.dev'

      # --- Cache des paquets R, clé déterministe -------------------------
      # `setup-r-dependencies` cache sur `hashFiles('.github/pkg.lock')`, or
      # `pak::lockfile_create()` écrit les paquets dans un ordre NON
      # déterministe : mesuré sur deux runs consécutifs, 332 entrées sur 377
      # avaient changé de place pour un contenu identique (même hash après
      # tri). La clé exacte manquait donc à CHAQUE run — repli sur le préfixe
      # et ré-upload de 482 Mo à chaque fois. On gère le cache nous-mêmes.
      #
      # La clé porte sur les seuls champs de dépendance de DESCRIPTION, pas
      # sur le fichier entier : sinon chaque bump de `Version:` — donc chaque
      # release et chaque ouverture de cycle dev — invaliderait le cache.
      # `setup-r-dependencies` ne pose `R_LIBS_USER` qu'au moment où elle
      # tourne : sans ça, notre cache et elle viseraient des dossiers
      # différents. Le contexte `runner` n'existant pas dans le bloc `env:`
      # d'un job, on l'exporte ici.
      - name: Fixer R_LIBS_USER
        run: echo "R_LIBS_USER=$RUNNER_TEMP/Library" >> "$GITHUB_ENV"

      - name: Empreinte des dependances
        id: deps
        run: |
          Rscript -e 'd <- read.dcf("DESCRIPTION"); f <- intersect(c("Depends", "Imports", "LinkingTo", "Suggests", "Remotes", "Additional_repositories"), colnames(d)); writeLines(as.character(d[1, f]), file.path(Sys.getenv("RUNNER_TEMP"), "deps-fingerprint"))'
          echo "hash=$(sha256sum "$RUNNER_TEMP/deps-fingerprint" | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache des paquets R
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/Library/*
            !${{ runner.temp }}/Library/pak
            !${{ runner.temp }}/Library/_cache
          key: ${{ runner.os }}-R${{ steps.setup-r.outputs.installed-r-version }}-deps${{ steps.deps.outputs.hash }}-v1
          restore-keys: ${{ runner.os }}-R${{ steps.setup-r.outputs.installed-r-version }}-deps

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libtbb-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: false   # cf. « Cache des paquets R » ci-dessus
          # rsconnect : requis par pkgdown::package_tutorials() pour découvrir
          # les tutoriels learnr de inst/tutorials/ (sinon « The package
          # rsconnect is required to find published tutorials »).
          # dissUtils/spinR : Imports de biodivMapR. Le prefixe gitlab:: de
          # spinR doit suivre celui que biodivMapR declare, sinon pak
          # refuse le graphe entier (incident du 2026-08-24).
          # (cf. r.yml), déclarés ici au root scope pour pak.
          extra-packages: |
            any::pkgdown
            any::rsconnect
            local::.
            github::cran/dissUtils
            gitlab::jbferet/spinR
          needs: website

      - name: Rebuild Rfast from source (oneTBB ABI mismatch)
        # Le binaire RSPM de Rfast est compilé contre une oneTBB ancienne
        # (symbole `tbb::task`, retiré des versions récentes) : son chargement
        # échoue sur `undefined symbol: _ZTIN3tbb4taskE` quand pkgdown charge le
        # namespace (via biodivMapR (Suggests) -> fundiversity -> Rfast).
        # R-CMD-check ne charge pas ce namespace, d'où l'échec pkgdown seul.
        # Recompiler depuis les sources contre le libtbb-dev du runner résout.
        run: install.packages("Rfast", type = "source")
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        # Deploy only on push to main / published release — never on a
        # pull_request or a manual workflow_dispatch (which build-only, so the
        # site can be validated from a branch without publishing it).
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
