# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # lasR / lidR are not on CRAN; resolve them from r-lidar's
          # r-universe. lidaRtRee comes from forge.inrae.fr (Remotes).
          extra-repositories: 'https://r-lidar.r-universe.dev'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # Un paquet `LinkingTo: terra` (p.ex. fasterRaster) installé en binaire
      # contre un autre terra corrompt le module Rcpp de terra au chargement →
      # « no valid constructor » sur terra::rast() au rendu des articles. On
      # recompile ces paquets depuis les sources contre le terra installé.
      - name: Rebuild terra-linking packages from source (ABI match)
        run: |
          ip <- installed.packages()
          lt <- ip[, "LinkingTo"]
          culprits <- setdiff(rownames(ip)[!is.na(lt) & grepl("terra", lt)], "terra")
          cat("LinkingTo terra:", paste(culprits, collapse = ", "), "\n")
          repos <- c("https://r-lidar.r-universe.dev",
                     "https://packagemanager.posit.co/cran/latest")
          for (p in culprits) tryCatch(
            install.packages(p, type = "source", repos = repos),
            error = function(e) cat("skip", p, ":", conditionMessage(e), "\n"))
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
