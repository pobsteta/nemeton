# Nemeton CI/CD Pipeline (ADR-010)
name: R-CMD-check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # Job 1: R CMD check (structure, documentation, imports)
  # ============================================================
  R-CMD-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          # lasR / lidR are not on CRAN; resolve them from r-lidar's
          # r-universe. lidaRtRee comes from forge.inrae.fr (Remotes).
          extra-repositories: 'https://r-lidar.r-universe.dev'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::remotes
          needs: check

      # terra (binaire) fonctionne sur le runner, MAIS un paquet `LinkingTo:
      # terra` (p.ex. fasterRaster) installé en binaire contre un AUTRE terra
      # corrompt le module Rcpp de terra une fois chargé : tout terra::rast()
      # ultérieur lève « no valid constructor available for the argument list ».
      # On recompile ces paquets depuis les sources contre le terra installé.
      - name: Rebuild terra-linking packages from source (ABI match)
        run: |
          ip <- installed.packages()
          lt <- ip[, "LinkingTo"]
          culprits <- setdiff(rownames(ip)[!is.na(lt) & grepl("terra", lt)], "terra")
          cat("LinkingTo terra:", paste(culprits, collapse = ", "), "\n")
          repos <- c("https://r-lidar.r-universe.dev",
                     "https://packagemanager.posit.co/cran/latest")
          for (p in culprits) tryCatch(
            install.packages(p, type = "source", repos = repos),
            error = function(e) cat("skip", p, ":", conditionMessage(e), "\n"))
        shell: Rscript {0}

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          # On saute le build des vignettes (intention déjà signalée par
          # --no-build-vignettes au check) : elles font du calcul spatial lourd
          # et redondant avec les tests testthat exécutés par `R CMD check`.
          args: 'c("--no-manual", "--no-vignettes", "--no-build-vignettes", "--as-cran")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: '"error"'
          upload-snapshots: true

  # ============================================================
  # Job 2: Tests (testthat)
  # ============================================================
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          # lasR / lidR are not on CRAN; resolve them from r-lidar's
          # r-universe. lidaRtRee comes from forge.inrae.fr (Remotes).
          extra-repositories: 'https://r-lidar.r-universe.dev'

      # GDAL noble = 3.8.4. La corruption « no valid constructor » de terra ne
      # survient que sur le runner (jamais en local sous GDAL 3.11). On aligne
      # le runner sur une GDAL récente via ubuntugis.
      - name: Install system dependencies (GDAL 3.11 via ubuntugis)
        run: |
          sudo add-apt-repository -y ppa:ubuntugis/ubuntugis-unstable
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libssl-dev libcurl4-openssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::remotes, any::devtools
          needs: check

      # Les binaires RSPM de terra/sf/exactextractr sont liés à la GDAL 3.8.4
      # de noble : après l'upgrade GDAL il faut les recompiler depuis les
      # sources contre la nouvelle GDAL, sinon l'ABI diverge.
      - name: Rebuild spatial packages from source (against upgraded GDAL)
        run: |
          install.packages(c("terra", "sf", "exactextractr"),
                           type = "source",
                           repos = "https://packagemanager.posit.co/cran/latest")
          cat("terra GDAL:", terra::gdal(), " sf GDAL:", sf::sf_extSoftVersion()[["GDAL"]], "\n")
        shell: Rscript {0}

      # Diagnostic : terra::rast() peut-il construire un SpatRaster sur ce
      # runner ? (le sandbox `R CMD check` lève « no valid constructor » ;
      # on isole si c'est terra-sur-runner ou spécifique au sandbox.)
      - name: Diagnose terra on runner
        run: |
          cat("Rcpp:", as.character(packageVersion("Rcpp")),
              "terra:", as.character(packageVersion("terra")), "\n")
          cat("GDAL:", terra::gdal(), "\n")
          # 1) construction en mémoire
          r <- tryCatch(terra::rast(nrows = 2, ncols = 2, vals = 1),
                        error = function(e) conditionMessage(e))
          cat("rast(in-memory):", if (inherits(r, "SpatRaster")) "OK" else r, "\n")
          # 2) round-trip fichier (écrit puis relit un .tif neuf)
          tf <- tempfile(fileext = ".tif")
          rt <- tryCatch({
            terra::writeRaster(terra::rast(nrows = 4, ncols = 4, vals = 1:16), tf)
            x <- terra::rast(tf); paste("OK", paste(dim(x), collapse = "x"))
          }, error = function(e) paste("ERR:", conditionMessage(e)))
          cat("rast(round-trip file):", rt, "\n")
          # 3) lecture d'un .tif embarqué du package (depuis le checkout source)
          pf <- "inst/extdata/massif_demo_dem.tif"
          cat("pkg tif exists:", file.exists(pf), "\n")
          rp <- tryCatch({ x <- terra::rast(pf); "OK" },
                         error = function(e) paste("ERR:", conditionMessage(e)))
          cat("rast(pkg tif):", rp, "\n")
          # 4) terra survit-il à load_all() de nemeton (ce que fait test()) ?
          cat("--- after pkgload::load_all ---\n")
          rl <- tryCatch({
            pkgload::load_all(".", quiet = TRUE, helpers = FALSE, attach_testthat = FALSE)
            if (inherits(terra::rast(pf), "SpatRaster")) "OK" else "not-SpatRaster"
          }, error = function(e) paste("ERR:", conditionMessage(e)))
          cat("rast(pkg tif) after load_all:", rl, "\n")
          # 5) EPSG-code CRS (needs proj.db) — the FAST tests create rasters
          #    with crs = "EPSG:32631", unlike the embedded-WKT package tifs.
          cat("PROJ_DATA env:", Sys.getenv("PROJ_DATA"),
              "| PROJ_LIB env:", Sys.getenv("PROJ_LIB"), "\n")
          cat("proj.db found:", paste(Sys.glob(c("/usr/share/proj*/proj.db",
              "/usr/share/proj/proj.db", "/usr/local/share/proj/proj.db")),
              collapse = ", "), "\n")
          re <- tryCatch({
            tf2 <- tempfile(fileext = ".tif")
            terra::writeRaster(terra::rast(nrows = 10, ncols = 10,
              xmin = 0, xmax = 100, ymin = 0, ymax = 100,
              crs = "EPSG:32631", vals = rep(0.5, 100)),
              tf2, filetype = "GTiff", overwrite = TRUE)
            "OK"
          }, error = function(e) paste("ERR:", conditionMessage(e)))
          cat("writeRaster(crs=EPSG:32631):", re, "\n")
        shell: Rscript {0}

      # Vrais tests, via load_all (comme en local où tout passe), plutôt que
      # test_package() qui ne trouvait aucun test installé (faux vert).
      - name: Run tests
        run: devtools::test(stop_on_failure = TRUE, reporter = "summary")
        shell: Rscript {0}

  # ============================================================
  # Job 3: Code coverage (covr + codecov)
  # ============================================================
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [R-CMD-check]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          # lasR / lidR are not on CRAN; resolve them from r-lidar's
          # r-universe. lidaRtRee comes from forge.inrae.fr (Remotes).
          extra-repositories: 'https://r-lidar.r-universe.dev'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libssl-dev libcurl4-openssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::remotes
          needs: coverage

      - name: Compute coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
