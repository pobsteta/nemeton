            !${{ runner.temp }}/Library/_cache
          key: ${{ runner.os }}-R${{ steps.setup-r.outputs.installed-r-version }}-deps${{ steps.deps.outputs.hash }}-v1
          restore-keys: ${{ runner.os }}-R${{ steps.setup-r.outputs.installed-r-version }}-deps

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libssl-dev libcurl4-openssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: false   # cf. « Cache des paquets R » ci-dessus
          # See R-CMD-check job: dissUtils/spinR for biodivMapR.
          extra-packages: |
            any::covr
            any::remotes
            github::cran/dissUtils
            jbferet/spinR
          needs: coverage

      - name: Compute coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
