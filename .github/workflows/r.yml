# Nemeton CI/CD Pipeline (ADR-010)
name: R-CMD-check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # Job 1: R CMD check (structure, documentation, imports)
  # ============================================================
  R-CMD-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::remotes
          needs: check

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--no-vignettes", "--no-build-vignettes", "--as-cran")'
          error-on: '"error"'
          upload-snapshots: true

  # ============================================================
  # Job 2: Tests (testthat)
  # ============================================================
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libssl-dev libcurl4-openssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::remotes
          needs: check

      - name: Run tests
        run: |
          testthat::test_package("nemeton", reporter = "summary")
        shell: Rscript {0}

  # ============================================================
  # Job 3: Docker build (verify image builds)
  # ============================================================
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [R-CMD-check]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nemeton:latest .

      - name: Verify image
        run: docker run --rm nemeton:latest R -e "library(nemeton); cat('nemeton', as.character(packageVersion('nemeton')), 'OK\n')"

  # Coverage is too heavy for free runners (~3000 tests with covr instrumentation).
  # Run locally with: Rscript -e 'covr::report(covr::package_coverage())'
