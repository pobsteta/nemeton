# Nemeton CI/CD Pipeline (ADR-010)
name: R-CMD-check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # Job 0: cohérence des versions (DESCRIPTION = NEWS = CITATION)
  # Garde-fou : empêche le drift qui laissait p.ex. le badge à la traîne.
  # On ne compare PAS au tag git (créé après le merge), seulement les
  # fichiers du dépôt — la version de release doit être posée AVANT le push.
  # ============================================================
  version-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: DESCRIPTION = NEWS.md = CITATION.cff
        run: |
          desc=$(awk '/^Version:/{print $2; exit}' DESCRIPTION)
          if ! [[ "$desc" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cycle dev ($desc) — garde-fou de cohérence sauté."
            exit 0
          fi
          news=$(grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' NEWS.md)
          cff=$(grep -m1 -E '^version:' CITATION.cff | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "DESCRIPTION=$desc  NEWS=$news  CITATION=$cff"
          if [ -z "$desc" ] || [ "$desc" != "$news" ] || [ "$desc" != "$cff" ]; then
            echo "::error::Versions désalignées (DESCRIPTION=$desc, NEWS=$news, CITATION=$cff)"
            exit 1
          fi
          echo "✅ versions alignées : $desc"

  # ============================================================
  # Job 1: R CMD check (structure, documentation, imports)
  # ============================================================
  R-CMD-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Fixé ici pour que notre cache et `setup-r-dependencies` visent le même
      # dossier : l'action ne pose `R_LIBS_USER` qu'au moment où elle tourne.
      R_LIBS_USER: ${{ runner.temp }}/Library
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      # Les « recommandés » d'apt sont des données et de la doc dont aucune
      # compilation n'a besoin : pari-elldata (57 Mo), pari-doc, lmodern,
      # mupdf-tools (49 Mo)… pak installe les dépendances système des paquets
      # R sans pouvoir passer d'option, on la pose donc globalement, avant
      # tout appel à apt (y compris ceux de setup-r).
      - name: Ne pas installer les paquets apt recommandes
        run: echo 'APT::Install-Recommends "false";' | sudo tee /etc/apt/apt.conf.d/99-no-recommends

      - name: Setup R
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          # lasR / lidR are not on CRAN; resolve them from r-lidar's
          # r-universe. lidaRtRee comes from forge.inrae.fr (Remotes).
          extra-repositories: 'https://r-lidar.r-universe.dev'

      # --- Cache des paquets R, clé déterministe -------------------------
      # `setup-r-dependencies` cache sur `hashFiles('.github/pkg.lock')`, or
      # `pak::lockfile_create()` écrit les paquets dans un ordre NON
      # déterministe : mesuré sur deux runs consécutifs, 332 entrées sur 377
      # avaient changé de place pour un contenu identique (même hash après
      # tri). La clé exacte manquait donc à CHAQUE run — repli sur le préfixe
      # et ré-upload de 482 Mo à chaque fois. On gère le cache nous-mêmes.
      #
      # La clé porte sur les seuls champs de dépendance de DESCRIPTION, pas
      # sur le fichier entier : sinon chaque bump de `Version:` — donc chaque
      # release et chaque ouverture de cycle dev — invaliderait le cache.
      - name: Empreinte des dependances
        id: deps
        run: |
          Rscript -e 'd <- read.dcf("DESCRIPTION"); f <- intersect(c("Depends", "Imports", "LinkingTo", "Suggests", "Remotes", "Additional_repositories"), colnames(d)); writeLines(as.character(d[1, f]), file.path(Sys.getenv("RUNNER_TEMP"), "deps-fingerprint"))'
          echo "hash=$(sha256sum "$RUNNER_TEMP/deps-fingerprint" | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache des paquets R
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/Library/*
            !${{ runner.temp }}/Library/pak
            !${{ runner.temp }}/Library/_cache
          key: ${{ runner.os }}-R${{ steps.setup-r.outputs.installed-r-version }}-deps${{ steps.deps.outputs.hash }}-v1
          restore-keys: ${{ runner.os }}-R${{ steps.setup-r.outputs.installed-r-version }}-deps

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: false   # cf. « Cache des paquets R » ci-dessus
          # biodivMapR (GPL-3, B4/L3) Imports dissUtils + spinR but omits
          # them from its own Remotes, so pak (which scopes Remotes per
          # package) can't resolve them from nemeton's Remotes alone.
          # Listing them here installs them at root scope with an explicit
          # source. dissUtils is CRAN-archived (cran/ mirror).
          extra-packages: |
            any::rcmdcheck
            any::remotes
            github::cran/dissUtils
            jbferet/spinR
          needs: check

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          # `--no-tests` : la suite testthat tourne dans le job `tests` dédié
          #   (via devtools::test). Le sandbox `R CMD check` exhibe une anomalie
          #   terra propre au runner GitHub (terra::rast/writeRaster lèvent
          #   « no valid constructor » dans ce contexte précis, alors que la
          #   même opération marche en R nu sur le runner et que toute la suite
          #   passe en local) — non reproductible et non liée au code.
          # `--no-build-vignettes` : vignettes (calcul spatial lourd) montées
          #   par pkgdown, pas ici.
          args: 'c("--no-manual", "--no-tests", "--no-vignettes", "--no-build-vignettes", "--as-cran")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: '"error"'
          upload-snapshots: true

  # ============================================================
  # Job 2: Tests (testthat)
  # ============================================================
  tests:
    runs-on: ubuntu-latest
    # 45 min : la suite complète frôle/dépasse 30 min sur un runner lent
    # (le job `coverage`, qui exécute aussi toute la suite via covr, tourne
    # ~35 min). Le cap 30 min provoquait des annulations intermittentes sans
    # rapport avec une vraie régression.
    timeout-minutes: 90

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Fixé ici pour que notre cache et `setup-r-dependencies` visent le même
      # dossier : l'action ne pose `R_LIBS_USER` qu'au moment où elle tourne.
      R_LIBS_USER: ${{ runner.temp }}/Library
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      # Les « recommandés » d'apt sont des données et de la doc dont aucune
      # compilation n'a besoin : pari-elldata (57 Mo), pari-doc, lmodern,
      # mupdf-tools (49 Mo)… pak installe les dépendances système des paquets
      # R sans pouvoir passer d'option, on la pose donc globalement, avant
      # tout appel à apt (y compris ceux de setup-r).
