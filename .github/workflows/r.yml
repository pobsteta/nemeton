# Nemeton CI/CD Pipeline (ADR-010)
name: R-CMD-check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # Job 1: R CMD check (structure, documentation, imports)
  # ============================================================
  R-CMD-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          # lasR / lidR are not on CRAN; resolve them from r-lidar's
          # r-universe. lidaRtRee comes from forge.inrae.fr (Remotes).
          extra-repositories: 'https://r-lidar.r-universe.dev'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::remotes
          needs: check

      # Le binaire terra RSPM (build 2026-05) est incompatible ABI avec le
      # Rcpp 1.1.1 servi plus récemment : terra::rast() lève « no valid
      # constructor available for the argument list » (Rcpp module mismatch),
      # ce qui faisait échouer les exemples/tests/vignettes. On recompile terra
      # depuis les sources contre le Rcpp installé pour réaligner l'ABI.
      - name: Rebuild terra from source (Rcpp ABI match)
        run: install.packages("terra", type = "source", repos = "https://packagemanager.posit.co/cran/latest")
        shell: Rscript {0}

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          # On saute le build des vignettes (intention déjà signalée par
          # --no-build-vignettes au check) : elles font du calcul spatial lourd
          # et redondant avec les tests testthat exécutés par `R CMD check`.
          args: 'c("--no-manual", "--no-vignettes", "--no-build-vignettes", "--as-cran")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: '"error"'
          upload-snapshots: true

  # ============================================================
  # Job 2: Tests (testthat)
  # ============================================================
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          # lasR / lidR are not on CRAN; resolve them from r-lidar's
          # r-universe. lidaRtRee comes from forge.inrae.fr (Remotes).
          extra-repositories: 'https://r-lidar.r-universe.dev'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libssl-dev libcurl4-openssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::remotes, any::devtools
          needs: check

      # Diagnostic : terra::rast() peut-il construire un SpatRaster sur ce
      # runner ? (le sandbox `R CMD check` lève « no valid constructor » ;
      # on isole si c'est terra-sur-runner ou spécifique au sandbox.)
      - name: Diagnose terra on runner
        run: |
          cat("Rcpp:", as.character(packageVersion("Rcpp")),
              "terra:", as.character(packageVersion("terra")), "\n")
          cat("GDAL:", terra::gdal(), "\n")
          r <- tryCatch(terra::rast(nrows = 2, ncols = 2, vals = 1),
                        error = function(e) conditionMessage(e))
          cat("rast(in-memory):", if (inherits(r, "SpatRaster")) "OK" else r, "\n")
          f <- system.file("extdata", "massif_demo_dem.tif", package = "terra")
          cat("terra demo file:", f, "\n")
        shell: Rscript {0}

      # Vrais tests, via load_all (comme en local où tout passe), plutôt que
      # test_package() qui ne trouvait aucun test installé (faux vert).
      - name: Run tests
        run: devtools::test(stop_on_failure = TRUE, reporter = "summary")
        shell: Rscript {0}

  # ============================================================
  # Job 3: Code coverage (covr + codecov)
  # ============================================================
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [R-CMD-check]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          # lasR / lidR are not on CRAN; resolve them from r-lidar's
          # r-universe. lidaRtRee comes from forge.inrae.fr (Remotes).
          extra-repositories: 'https://r-lidar.r-universe.dev'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libssl-dev libcurl4-openssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::remotes
          needs: coverage

      - name: Compute coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
