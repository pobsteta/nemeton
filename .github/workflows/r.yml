# Nemeton CI/CD Pipeline (ADR-010)
name: R-CMD-check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # Job 0: cohérence des versions (DESCRIPTION = NEWS = CITATION)
  # Garde-fou : empêche le drift qui laissait p.ex. le badge à la traîne.
  # On ne compare PAS au tag git (créé après le merge), seulement les
  # fichiers du dépôt — la version de release doit être posée AVANT le push.
  # ============================================================
  version-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: DESCRIPTION = NEWS.md = CITATION.cff
        run: |
          desc=$(awk '/^Version:/{print $2; exit}' DESCRIPTION)
          if ! [[ "$desc" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cycle dev ($desc) — garde-fou de cohérence sauté."
            exit 0
          fi
          news=$(grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' NEWS.md)
          cff=$(grep -m1 -E '^version:' CITATION.cff | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "DESCRIPTION=$desc  NEWS=$news  CITATION=$cff"
          if [ -z "$desc" ] || [ "$desc" != "$news" ] || [ "$desc" != "$cff" ]; then
            echo "::error::Versions désalignées (DESCRIPTION=$desc, NEWS=$news, CITATION=$cff)"
            exit 1
          fi
          echo "✅ versions alignées : $desc"

  # ============================================================
  # Job 1: R CMD check (structure, documentation, imports)
  # ============================================================
  R-CMD-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          # lasR / lidR are not on CRAN; resolve them from r-lidar's
          # r-universe. lidaRtRee comes from forge.inrae.fr (Remotes).
          extra-repositories: 'https://r-lidar.r-universe.dev'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # biodivMapR (GPL-3, B4/L3) Imports dissUtils + spinR but omits
          # them from its own Remotes, so pak (which scopes Remotes per
          # package) can't resolve them from nemeton's Remotes alone.
          # Listing them here installs them at root scope with an explicit
          # source. dissUtils is CRAN-archived (cran/ mirror).
          extra-packages: |
            any::rcmdcheck
            any::remotes
            github::cran/dissUtils
            jbferet/spinR
          needs: check

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          # `--no-tests` : la suite testthat tourne dans le job `tests` dédié
          #   (via devtools::test). Le sandbox `R CMD check` exhibe une anomalie
          #   terra propre au runner GitHub (terra::rast/writeRaster lèvent
          #   « no valid constructor » dans ce contexte précis, alors que la
          #   même opération marche en R nu sur le runner et que toute la suite
          #   passe en local) — non reproductible et non liée au code.
          # `--no-build-vignettes` : vignettes (calcul spatial lourd) montées
          #   par pkgdown, pas ici.
          args: 'c("--no-manual", "--no-tests", "--no-vignettes", "--no-build-vignettes", "--as-cran")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: '"error"'
          upload-snapshots: true

  # ============================================================
  # Job 2: Tests (testthat)
  # ============================================================
  tests:
    runs-on: ubuntu-latest
    # 45 min : la suite complète frôle/dépasse 30 min sur un runner lent
    # (le job `coverage`, qui exécute aussi toute la suite via covr, tourne
    # ~35 min). Le cap 30 min provoquait des annulations intermittentes sans
    # rapport avec une vraie régression.
    timeout-minutes: 45

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          # lasR / lidR are not on CRAN; resolve them from r-lidar's
          # r-universe. lidaRtRee comes from forge.inrae.fr (Remotes).
          extra-repositories: 'https://r-lidar.r-universe.dev'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libssl-dev libcurl4-openssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # See R-CMD-check job: dissUtils/spinR are biodivMapR Imports
          # missing from its Remotes; declare them at root scope for pak.
          extra-packages: |
            any::testthat
            any::remotes
            any::devtools
            github::cran/dissUtils
            jbferet/spinR
          needs: check

      # Vrais tests via devtools::test() (load_all, comme en local où la suite
      # passe), plutôt que testthat::test_package() qui ne trouvait aucun test
      # installé et passait à vide (faux vert). Les tests du pipeline raster
      # FAST se gardent eux-mêmes via skip_if_terra_write_broken() contre une
      # anomalie terra propre au runner (cf. helper-fast-raster.R).
      - name: Run tests
        run: devtools::test(stop_on_failure = TRUE, reporter = "summary")
        shell: Rscript {0}

  # ============================================================
  # Job 3: Code coverage (covr + codecov)
  # ============================================================
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [R-CMD-check]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          # lasR / lidR are not on CRAN; resolve them from r-lidar's
          # r-universe. lidaRtRee comes from forge.inrae.fr (Remotes).
          extra-repositories: 'https://r-lidar.r-universe.dev'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libssl-dev libcurl4-openssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # See R-CMD-check job: dissUtils/spinR for biodivMapR.
          extra-packages: |
            any::covr
            any::remotes
            github::cran/dissUtils
            jbferet/spinR
          needs: coverage

      - name: Compute coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
